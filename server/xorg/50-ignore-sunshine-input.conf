Section "InputClass"
    Identifier "Ignore Sunshine passthrough input"
    MatchProduct "passthrough"
    Option "Ignore" "true"
EndSection

Section "InputClass"
    Identifier "Ignore Sunshine virtual pads"
    MatchProduct "Sunshine"
    Option "Ignore" "true"
EndSection

Section "InputClass"
    Identifier "Ignore Sunshine input by USB id"
    MatchUSBID "beaf:dead"
    Option "Ignore" "true"
EndSection
