# Optional: pin SDDM/X11 sessions to the NVIDIA GPU so the Intel iGPU stays
# free for Sunshine's VAAPI encoding. Adjust BusID to your topology
# (lspci | grep -i vga). Only needed if a discrete GPU and an iGPU coexist.
Section "Device"
    Identifier "NVIDIA Primary"
    Driver "nvidia"
    BusID  "PCI:1:0:0"
EndSection
