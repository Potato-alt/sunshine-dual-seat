# Sunshine server config for the headless dual-session setup.
#
# capture = wlr        : capture the headless Sway output via wlroots screencopy.
# output_name          : the virtual output created by the headless sway session.
# encoder = vaapi      : encode on the Intel iGPU (VAAPI). Do NOT use nvenc here —
#                        on this stack an NVENC session hard-hangs the whole host
#                        (see docs/gotchas.md). Point adapter_name at the Intel
#                        render node (usually renderD129 when NVIDIA is renderD128).
# system_tray disabled : CRITICAL — a tray notification at session start makes a
#                        synchronous D-Bus call that deadlocks Sunshine's main
#                        thread (RTSP ANNOUNCE never answered -> "Initial Ping
#                        Timeout"). See docs/gotchas.md.
# gamepad = x360       : the default DS4/PS5 pad adds a touchpad to the sway seat
#                        mid-session; x360 avoids that class of quirks.
# sw_preset/min_threads: fallback knobs if you must run the software x264 encoder.

capture = wlr
output_name = HEADLESS-1
audio_sink = sink-sunshine-stereo
encoder = vaapi
adapter_name = @RENDER_NODE@
min_threads = 4
sw_preset = ultrafast
gamepad = x360
system_tray = disabled
csrf_allowed_origins = https://@SERVER_IP@:47990
